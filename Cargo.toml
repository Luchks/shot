[package]
name = "my-screenshot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Selector de región de pantalla por teclado (estilo vim) para Hyprland/wlroots, mediante wlr-layer-shell."
license = "MIT"

[[bin]]
name = "my-screenshot"
path = "src/main.rs"

[dependencies]
# --- Wayland core ---
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.1", features = ["client"] }

# --- Toolkit de alto nivel (layer-shell, seat/teclado, output) ---
# Se deshabilitan las features por defecto para controlar explícitamente
# qué se activa: solo necesitamos el bucle de eventos (calloop) y xkbcommon
# para la interpretación del teclado.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = [
    "calloop",
    "xkbcommon",
] }

# --- Bucle de eventos ---
calloop = "0.14.0"
calloop-wayland-source = "0.4.0"

# --- Interpretación de teclado (independiente del binding que trae SCTK,
# se declara explícito por si se necesita acceso directo a xkb_state) ---
xkbcommon = { version = "0.8.0", features = ["wayland"] }

# --- Utilidades de bajo nivel usadas por SCTK/mmap de buffers wl_shm ---
memmap2 = "0.9.0"
rustix = { version = "1.1.4", features = ["fs", "pipe", "shm"] }

[profile.release]
opt-level = 3
lto = true
strip = true
